<html>

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1, maximum-scale=1">
  <meta name="mobile-web-app-capable" content="yes">

  <title>Video Chat!</title>

  <link rel="stylesheet" href="./css/fontawesome5.min.css">
  <link rel="stylesheet" href="./css/main.css">

</head>

<body>
  <div id="unsupported">Your browser can't do video calls. Please update to a current Chrome, Firefox, Edge or Safari, and open this page via https.</div>
  <div id="mediaDiv"></div>
  <div id="chatDiv" hidden>
    <div id="chatHeader">Chat<button id="chatCloseBtn" title="close chat" aria-label="close chat">&times;</button></div>
    <div id="chatText"></div>
    <div id="chatInputRow">
      <input id="chatInputText" placeholder="Message..." type="text" enterkeyhint="send">
      <button id="chatSendBtn" aria-label="send"><i class="fas fa-paper-plane"></i></button>
    </div>
  </div>
  <dialog id="shareDialog">
    <button value="close" aria-label="close" onclick="shareDialog.close()">&times;</button>
    <h2>Invite to this call</h2>
    <p>Send this link to the people you want to talk to. Anyone with it can join: the room is the part after #.</p>
    <div>
      <input id="shareLink" readonly aria-label="room link">
      <button id="copyLinkBtn"><i class="far fa-copy"></i> Copy</button>
    </div>
  </dialog>
  <div id="mediaControllContainer">
    <div id="mediaControll">
      <div title="mute / unmute microphon!" id="muteUnmuteMicBtn" class="callBtn"><i class="fas fa-microphone-alt"></i></div>
      <div id="cameraGroup">
        <div title="add / remove camera!" id="addRemoveCameraBtn" class="callBtn"><i class="fas fa-video"></i></div>
        <div title="select camera" id="selectCameraBtn" style="display:none;"><i class="fas fa-caret-up"></i><select id="cameraSelect" aria-label="select camera"></select></div>
      </div>
      <div title="add / remove screen!" id="addRemoveScreenBtn" class="callBtn"><i class="fas fa-desktop"></i></div>
      <div title="screen share: sharp text (click for smooth motion)" id="screenModeBtn" class="callBtn" role="button" tabindex="0" aria-pressed="false" hidden><i class="fas fa-font"></i></div>
      <div id="moreGroup">
        <div title="more" id="moreBtn" class="callBtn"><i class="fas fa-ellipsis-h"></i></div>
        <div id="moreMenu" hidden>
          <button id="addRemoveChatBtn"><i class="far fa-comment-dots"></i> Chat</button>
          <button id="changeNameBtn"><i class="fas fa-user-edit"></i> Change name</button>
          <button id="shareBtn"><i class="fas fa-share-alt"></i> Share link</button>
        </div>
      </div>
      <div title="cancel call!" id="cancelCallBtn" class="callBtn"><i class="fas fa-phone-slash"></i></div>
    </div>
  </div>
  <div id="audioStreams"></div>
  <script src="js/socket.io.min.js"></script>

  <script src="js/ezWebRTC.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/main.js"></script>
</body>


</html>
