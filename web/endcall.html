<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1, maximum-scale=1">
        <meta name="mobile-web-app-capable" content="yes">

        <title>Call ended</title>
        <link rel="stylesheet" href="./css/main.css">
    </head>
    <body>
        <main id="endCard">
            <h2>Call ended</h2>
            <div id="duration"></div>
            <dl id="stats"></dl>
            <a id="newCallBtn" href="./">Start a new call</a>
            <p>You can close this tab now.</p>
        </main>
        <script>
            // Written by the call page at hang-up, per tab only (see callSummary in main.js). Names come from peers: text only.
            let s; try { s = JSON.parse(sessionStorage.lastCall) } catch { }
            if (s) {
                const t = Math.round(s.ms / 1000), two = n => String(n).padStart(2, "0");
                document.getElementById("duration").textContent = (t >= 3600 ? `${Math.floor(t / 3600)}:${two(Math.floor(t / 60) % 60)}` : Math.floor(t / 60)) + `:${two(t % 60)}`;
                const rows = [
                    ["With", s.names.map(n => n || "someone").join(", ") || "Nobody joined"],
                    s.relay != null && ["Connection", s.relay ? "Through a relay server" : "Direct, device to device"],
                    s.rtt != null && ["Round trip", Math.round(s.rtt * 1000) + " ms"],
                    ["Encryption", "End to end"],
                ].filter(Boolean);
                for (const [k, v] of rows) document.getElementById("stats").append(Object.assign(document.createElement("dt"), { textContent: k }), Object.assign(document.createElement("dd"), { textContent: v }));
            }
        </script>
    </body>
</html>
