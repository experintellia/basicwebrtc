name: test
on: [push, pull_request]
permissions:
  contents: read
concurrency: # a new push cancels the old run (saves macOS minutes)
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # explicit browsers path: sudo below may change HOME, where Playwright looks by default
      - run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw" >> "$GITHUB_ENV"
      - run: npx playwright-core install --with-deps firefox
      # root so the P2P-outage test can drop UDP with iptables
      - run: sudo -E env "PATH=$PATH" HOME=/root CHROMIUM_PATH=/usr/bin/google-chrome npm test
  safari:
    # ponytail: macOS minutes cost 10x; push only (not again for the PR) and capped
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo safaridriver --enable
      - run: node --test --test-force-exit test/crossbrowser.test.js
        env:
          SAFARI: 1
          CHROMIUM_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
