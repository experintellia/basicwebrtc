name: test
on: [push, pull_request]
permissions:
  contents: read
concurrency: # a new push cancels the old run (saves macOS minutes)
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }} # every master commit keeps its result
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Firefox does not run as root: its cross-browser test gets a step of its own,
      # before the root run, which leaves root-owned Chrome files in $HOME
      - run: npx playwright-core install --with-deps firefox
      - run: node --test --test-force-exit test/crossbrowser.test.js
        env:
          FIREFOX: 1
          CHROMIUM_PATH: /usr/bin/google-chrome
      # root so the P2P-outage test can drop UDP with iptables
      - run: sudo -E env "PATH=$PATH" CHROMIUM_PATH=/usr/bin/google-chrome npm test
  safari:
    # ponytail: macOS minutes cost 10x; push only (not again for the PR) and capped
    if: github.event_name == 'push'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo safaridriver --enable
      - run: node --test --test-force-exit test/crossbrowser.test.js
        env:
          SAFARI: 1
          CHROMIUM_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
